# The notch's GitHub tab: open PRs and issues of your repos and your organizations (gh), the
# latest 6 of each under a header with the counts. A click opens it on GitHub (the header:
# github.com/pulls). Refreshed when the notch opens and every 5 minutes. Needs `gh auth login`.
# Include it: include = ["themes/liquid-glass.toml", "templates/github.toml"]
# vars: notch (the notch item, default island), nerd (a Nerd Font for the icons)

[[item]]
name = "github"
position = "popup.${notch:-island}"
tab = "GitHub"
icon = { string = "", font = "${nerd:-Hack Nerd Font}:Bold:14", padding_left = 12, padding_right = 8 }
label = { string = "…", font = "${font:-SF Pro}:Semibold:13", color = "${secondary:-0xaaffffff}", padding_right = 12 }
update_freq = 300
updates = "on"
subscribe = "notch_open"
click_script = "open https://github.com/pulls"
background = { drawing = true, color = "0x00000000", height = 22, corner_radius = 11 }
hover = { background.glass = "hover", background.color = "${hover:-0x24ffffff}" }
# its rows: items github.N, made again on each run
script = '''
owners="user:$(gh api user --jq .login) $(gh api user/orgs --jq '.[].login' | sed 's/^/org:/' | tr '\n' ' ')"
search() { # $1: pr or issue; the count, then the latest 6
  gh api -X GET search/issues -f q="state:open is:$1 archived:false $owners" -f sort=updated -f per_page=6 \
    --jq '"\(.total_count)", (.items[] | [(.repository_url | split("/")[-1]), .number, .title, .html_url, (.draft // false)] | @tsv)'
}
prs=$(search pr) issues=$(search issue)
skylandbar --set "$NAME" label="$(head -1 <<<"$prs") PRs · $(head -1 <<<"$issues") issues"

args=() i=0
row() { # $1: icon, $2: its color; stdin: the rows
  while IFS=$'\t' read -r repo number title url draft; do
    color=$2; [ "$draft" = true ] && color=0x66ffffff
    args+=(--add item "github.$i" popup.${notch:-island}
      --set "github.$i" tab=GitHub icon="$1" icon.font="${nerd:-Hack Nerd Font}:Bold:13" icon.color="$color"
      icon.padding_left=12 icon.padding_right=8 label="$repo#$number  $title" label.font="${font:-SF Pro}:Regular:12"
      label.max_chars=64 label.padding_right=12 click_script="open '$url'"
      background.drawing=on background.color=0x00000000 background.height=22 background.corner_radius=11
      hover.background.glass=hover hover.background.color=${hover:-0x24ffffff})
    i=$((i + 1))
  done
}
row  0xff30d158 < <(tail -n +2 <<<"$prs")
row  0xffbf5af2 < <(tail -n +2 <<<"$issues")
skylandbar --remove '/^github\.[0-9]+$/' 2>/dev/null
[ ${#args[@]} -gt 0 ] && skylandbar "${args[@]}"
'''
